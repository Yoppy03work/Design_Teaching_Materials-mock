<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        margin: 12px 0;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .label {
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      .types {
        display: flex;
        gap: 6px;
      }
      .types button {
        flex: 1;
        padding: 6px 0;
        font-size: 12px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      .types button[aria-pressed="true"] {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      input[type="range"] {
        width: 100%;
      }
      .note {
        font-size: 11px;
        color: #777;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>色覚シミュレータ</h1>

    <div class="row toggle">
      <input type="checkbox" id="enabled" />
      <label for="enabled">シミュレーションを有効にする（全ページ）</label>
    </div>

    <div class="row">
      <div class="label">型</div>
      <div class="types" id="types">
        <button type="button" data-type="protan">P型</button>
        <button type="button" data-type="deutan">D型</button>
        <button type="button" data-type="tritan">T型</button>
      </div>
    </div>

    <div class="row">
      <div class="label">程度: <span id="sevval">60</span>%</div>
      <input type="range" id="severity" min="0" max="100" step="10" value="60" />
    </div>

    <p class="note">
      Machado 2009 を線形RGBで適用し、ページ全体をシミュレーションします。新しく開く／再読み込みするページに反映されます。
    </p>

    <script src="popup.js"></script>
  </body>
</html>
